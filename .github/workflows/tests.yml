# Runs all Task-1, Task-2 and Task-3 test cases.
#
# The spec asks for the tests to run "every time a user types git status".
# `git status` is a local command and GitHub cannot see it, so this workflow
# runs on the events that GitHub does see: every push and pull request (also
# from forks), and a manual "Run workflow" button.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hadolint
        run: |
          scripts/get_hadolint.sh
          echo "HADOLINT_BIN=$GITHUB_WORKSPACE/bin/hadolint" >> "$GITHUB_ENV"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install --no-deps -e .

      - name: Run the 13 test cases
        shell: bash  # makes the step use "set -o pipefail", so a failed test fails the job
        env:
          CISDIFF_REQUIRE_HADOLINT: "1"
        run: pytest -v --junitxml=test-results.xml 2>&1 | tee test-log.txt

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            test-log.txt
            test-results.xml
