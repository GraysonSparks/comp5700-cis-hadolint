[project]
name = "comp5700-cis-hadolint"
version = "0.1.0"
description = "Detect changes between CIS Docker Benchmark versions and run the matching Hadolint rules (COMP 5700 project)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "pandas>=3.1.1",
    "pypdf>=7.0.0",
    "pyyaml>=6.0.3",
    "torch>=2.15.0",
    "transformers>=5.22.2",
]

[project.scripts]
cisdiff = "cisdiff.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cisdiff"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
